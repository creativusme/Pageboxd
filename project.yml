# Specifica XcodeGen: il progetto Xcode viene generato su macOS (GitHub Actions),
# così dal PC Windows non serve alcun file .xcodeproj.
name: Pageboxd

options:
  bundleIdPrefix: com.pageboxd
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "4"

targets:
  Pageboxd:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Pageboxd
    info:
      path: SupportingFiles/Info.plist
      properties:
        CFBundleDisplayName: Pageboxd
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Pageboxd usa la fotocamera per scansionare il codice a barre ISBN e fotografare la tua edizione."
        # Rende visibile la cartella dell'app in File > Sul mio iPhone > Pageboxd
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # Mantieni sempre lo stesso bundle ID: iOS conserva i dati solo se
        # l'app reinstallata ha lo stesso identificativo di quella esistente.
        PRODUCT_BUNDLE_IDENTIFIER: com.pageboxd.journal
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
